- id: '1726659595098'
  alias: 'Alerte fonctionnement Frigo '
  description: ''
  triggers:
  - entity_id:
    - input_boolean.frigo
    for:
      hours: 2
      minutes: 0
      seconds: 0
    trigger: state
    to:
    - 'on'
    id: Etat
  - trigger: temperature.crossed_threshold
    target:
      entity_id: sensor.thermometre_frigo_temperature
    options:
      behavior: each
      for: 00:00:00
      threshold:
        type: above
        value:
          active_choice: number
          number: 10
          unit_of_measurement: °C
    id: Chaud
  - trigger: temperature.crossed_threshold
    target:
      entity_id: sensor.thermometre_frigo_temperature
    options:
      behavior: each
      for: 00:00:00
      threshold:
        type: below
        value:
          active_choice: number
          number: 2
          unit_of_measurement: °C
    id: Froid
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.frigo
        state:
        - 'on'
      - condition: trigger
        id:
        - Etat
      sequence:
      - data:
          message: Le frigo est allumé depuis 2h !
        action: notify.notify
    - conditions:
      - condition: state
        entity_id: input_boolean.frigo
        state:
        - 'off'
      - condition: trigger
        id:
        - Etat
      sequence:
      - data:
          message: Le frigo est éteint depuis 2h !
        action: notify.notify
    - conditions:
      - condition: trigger
        id:
        - Froid
      sequence:
      - data:
          message: Le frigo est descendu en dessous de 2°C !
        action: notify.notify
    - conditions:
      - condition: trigger
        id:
        - Chaud
      sequence:
      - data:
          message: Le frigo est monté au dessus de 10°C !
        action: notify.notify
  mode: single
- id: '1726759242515'
  alias: Solcast update
  description: ''
  triggers:
  - value_template: "{% set nr = as_datetime(state_attr('sun.sun','next_rising'))
      | as_local %} {% set ns = as_datetime(state_attr('sun.sun','next_setting'))
      | as_local %} {% set api_request_limit = 10 %} {% if nr > ns %}\n  {% set nr
      = nr - timedelta(hours = 24) %} \n{% endif %} {% set hours_difference = (ns
      - nr) %} {% set interval_hours = hours_difference / api_request_limit %} {%
      set ns = namespace(match = false) %} {% for i in range(api_request_limit) %}\n
      \ {% set start_time = nr + (i * interval_hours) %}\n  {% if ((start_time - timedelta(seconds=30))
      <= now()) and (now() <= (start_time + timedelta(seconds=30))) %}\n    {% set
      ns.match = true %}\n  {% endif %}\n{% endfor %} {{ ns.match }}"
    trigger: template
  conditions:
  - condition: sun
    before: sunset
    after: sunrise
  actions:
  - delay:
      seconds: '{{ range(30, 60)|random|int }}'
  - data: {}
    action: solcast_solar.update_forecasts
  mode: single
