  alias: Gestion priorité
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.priorite_batterie
    from: 'off'
    to: 'on'
    id: batterie
  - trigger: state
    entity_id:
    - input_boolean.priorite_batterie
    from: 'on'
    to: 'off'
    id: ecs
  conditions:
  - condition: state
    entity_id: input_boolean.automatisation
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - batterie
      sequence:
      - action: automation.trigger
        metadata: {}
        data:
          skip_condition: true
        target:
          entity_id: automation.activer_batterie
      - type: turn_off
        device_id: 62be3297a0c0d75c708f1a2e49911819
        entity_id: 84ede9c070c6abc84dbd5367e484c988
        domain: switch
      - action: automation.turn_off
        metadata: {}
        data:
          stop_actions: true
        target:
          entity_id: automation.activation_routeur_solaire
    - conditions:
      - condition: trigger
        id:
        - ecs
      sequence:
      - action: automation.trigger
        metadata: {}
        data:
          skip_condition: true
        target:
          entity_id: automation.desactiver_batterie
      - action: automation.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: automation.activation_routeur_solaire
        enabled: true
      - type: turn_on
        device_id: 62be3297a0c0d75c708f1a2e49911819
        entity_id: 84ede9c070c6abc84dbd5367e484c988
        domain: switch
  mode: restart
- id: '1744753049397'
  alias: Alerte batterie & chauffe-eau
  description: Lorsque la batterie se décharge et le chauffe-eau est en charge, envoie
    une notification avec bouton pour désactiver la priorité batterie.
  triggers:
  - value_template: '{{ (states(''sensor.consommation_batterie'')|float(0) > 50) and
      (states(''sensor.consommation_cumulus'')|float(0) > 50) }}

      '
    for:
      hours: 0
      minutes: 1
      seconds: 0
    trigger: template
    id: alerte
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - alerte
    then:
    - data:
        message: La batterie se décharge et le chauffe-eau est en charge. Désactivation
          du Cumulus.
      action: notify.mobile_app_iphone_de_mat_13
    - target:
        entity_id:
        - input_boolean.priorite_batterie
        - input_boolean.gestion_batterie_autonome
      action: input_boolean.turn_off
      data: {}
      enabled: false
    - action: automation.trigger
      metadata: {}
      data:
        skip_condition: true
      target:
        entity_id: automation.desactiver_batterie
      enabled: false
    - wait_for_trigger:
      - value_template: '{{ (states(''sensor.consommation_cumulus'')|float(0) < 10)
          }}

          '
        for:
          hours: 0
          minutes: 1
          seconds: 0
        trigger: template
        id: alerte
      enabled: false
    - action: input_boolean.turn_on
      target:
        entity_id:
        - input_boolean.priorite_batterie
        - input_boolean.gestion_batterie_autonome
      data: {}
      enabled: false
  - type: turn_off
    device_id: 62be3297a0c0d75c708f1a2e49911819
    entity_id: 84ede9c070c6abc84dbd5367e484c988
    domain: switch
  mode: single
- id: '1744807044766'
  alias: Alerte Marstek
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.capteurs_marstek
    from: 'off'
    to:
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 30
  conditions: []
  actions:
  - data:
      message: "❗ Alerte Marstek : {{\n  state_attr(trigger.get('entity_id',''), 'friendly_name')
        or 'Capteur inconnu'\n}} est en défaut."
    action: notify.notify
  mode: single
- id: '1744807759043'
  alias: Gestion batterie autonome
  description: Pilotage direct batterie avec compensation, gestion SOC et charge forcée
  triggers:
  - entity_id: sensor.em06_02_b1_power
    id: mise_a_jour_reseau
    trigger: state
  - entity_id: input_boolean.gestion_batterie_autonome
    to: 'on'
    id: activation_gestion
    trigger: state
  - entity_id: input_boolean.gestion_batterie_autonome
    to: 'off'
    id: desactivation_gestion
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.gestion_batterie_autonome
      state: 'on'
    - condition: trigger
      id:
      - desactivation_gestion
  actions:
  - variables:
      zone_morte: 10
      coefficient_amortissement: 1
      puissance_reseau: '{{ states(''sensor.em06_02_b1_power'') | float(0) }}'
      puissance_batterie2: '{{ states(''sensor.em06_02_b2_power'') | float(0) }}'
      puissance_batterie: '{{ states(''sensor.esphome_web_a92940_marstek_ac_power'')
        | float(0) }}'
      consigne_batterie: '{{ puissance_batterie + (puissance_reseau * coefficient_amortissement)}}'
      puissance_charge_max_globale: '{{ states(''number.esphome_web_a92940_marstek_max_charge_power'')
        | float(2500) }}'
      puissance_decharge_max_globale: '{{ states(''number.esphome_web_a92940_marstek_max_discharge_power'')
        | float(2500) }}'
      soc_batterie: '{{ states(''sensor.esphome_web_a92940_marstek_battery_state_of_charge'')
        | float(12) }}'
      soc_max: '{{ states(''number.esphome_web_a92940_marstek_charging_cutoff_capacity'')
        | float(100) }}'
      soc_min: '{{ states(''number.esphome_web_a92940_marstek_discharging_cutoff_capacity'')
        | float(12) }}'
      voltage: '{{ states(''sensor.esphome_web_a92940_marstek_battery_voltage_average'')
        | float(50) }}'
      correction_consigne_decharge: 10
      correction_consigne_charge: -10
  - alias: Choix entre désactivation et charge/décharge
    choose:
    - alias: Désactivation Gestion
      conditions:
      - condition: or
        conditions:
        - condition: trigger
          id:
          - desactivation_gestion
        alias: Déclenché par Désactivation
      sequence:
      - target:
          entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
        data:
          option: stop
        action: select.select_option
      - target:
          entity_id:
          - number.esphome_web_a92940_marstek_forcible_charge_power
          - number.esphome_web_a92940_marstek_forcible_discharge_power
        data:
          value: '0'
        action: number.set_value
      - target:
          entity_id: select.esphome_web_a92940_marstek_rs485_control_mode
        data:
          option: disable
        action: select.select_option
    - alias: Charge forcée
      conditions:
      - condition: state
        entity_id: input_boolean.charge_forcee_batterie
        state: 'on'
      sequence:
      - alias: Calcul des variables de base
        variables:
          consommation_reseau_hors_charge: '{{ [states(''sensor.consommation_reseau'')
            | float(0) - states(''number.esphome_web_a92940_marstek_forcible_charge_power'')
            | float(0), 0] | max | int }}

            '
          puissance_max_autorisee: '{{ [9000 - consommation_reseau_hors_charge, 0]
            | max | int }}

            '
          puissance_charge_final: "{% if states('number.esphome_web_a92940_marstek_max_charge_power')
            | float(0) > puissance_max_autorisee %}\n  {{ puissance_max_autorisee
            }}\n{% else %}\n  {{ states('number.esphome_web_a92940_marstek_max_charge_power')
            | float(0) }}\n{% endif %}\n"
          consommation_totale: '{{ consommation_reseau_hors_charge + puissance_charge_final
            }}

            '
      - alias: Vérification de la possibilité de charge
        if:
        - condition: template
          value_template: '{{ puissance_charge_final > 0 }}'
          alias: Puissance charge  > 0W
        then:
        - target:
            entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
          data:
            option: charge
          action: select.select_option
          alias: Mode Charge
        - alias: Application de la puissance de charge finale
          target:
            entity_id: number.esphome_web_a92940_marstek_forcible_charge_power
          data:
            value: '{{ puissance_charge_final }}'
          action: number.set_value
        - alias: Désactivation de la décharge batterie
          target:
            entity_id: number.esphome_web_a92940_marstek_forcible_discharge_power
          data:
            value: '0'
          action: number.set_value
        - alias: Activation du mode RS485
          action: select.select_option
          metadata: {}
          target:
            entity_id: select.esphome_web_a92940_marstek_rs485_control_mode
          data:
            option: enable
        else:
        - alias: Désactivation de la charge forcée (impossible)
          target:
            entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
          data:
            option: stop
          action: select.select_option
        - alias: Gestion des appareils en surconsommation
          choose:
          - alias: Désactivation du sèche-serviette (9000W < consommation ≤ 9800W)
            conditions:
            - condition: template
              value_template: '{{ consommation_totale and consommation_totale

                <= 9800 and

                states(''select.prise_seche_serviette_pilot_wire_mode'')

                != ''off'' }}'
            sequence:
            - target:
                entity_id: select.prise_seche_serviette_pilot_wire_mode
              data:
                option: 'off'
              action: select.select_option
            - alias: Notification désactivation sèche-serviette
              data:
                message: 'Désactivation du sèche-serviette (800W) :

                  consommation entre 9000W et 9800W.'
                title: ⚠️ Appareil désactivé
              action: notify.notify
          - alias: Désactivation du cumulus (consommation > 9800W)
            conditions:
            - condition: template
              value_template: '{{ consommation_totale > 9800 and

                states(''switch.shelly_plus_1pm_01_switch_0'') == ''on''

                }}'
            sequence:
            - target:
                entity_id: switch.shelly_plus_1pm_01_switch_0
              data:
                option: 'off'
              action: switch.turn_off
            - alias: Notification désactivation cumulus
              data:
                message: 'Désactivation du cumulus (3000W) : consommation >

                  9800W.'
                title: ⚠️ Appareil désactivé
              action: notify.notify
        - alias: Vérification de la réactivation possible des appareils
          if:
          - condition: template
            value_template: '{{ consommation_totale < 8500 }}'
            alias: Consommation < 8500W
          then:
          - alias: Réactivation des appareils si consommation < 8500W
            choose:
            - alias: Réactivation du cumulus
              conditions:
              - condition: template
                value_template: '{{ states(''switch.shelly_plus_1pm_01_switch_0'')
                  ==

                  ''off'' }}'
              sequence:
              - target:
                  entity_id: switch.shelly_plus_1pm_01_switch_0
                data:
                  option: 'on'
                action: switch.turn_on
              - alias: Notification réactivation cumulus
                data:
                  message: Réactivation du cumulus (3000W).
                  title: ✅ Appareil réactivé
                action: notify.notify
            - alias: Réactivation du sèche-serviette
              conditions:
              - condition: template
                value_template: '{{ states(''select.prise_seche_serviette_pilot_wire_mode'')
                  == ''off'' and states(''switch.shelly_plus_1pm_01_switch_0'') ==
                  ''on'' }}'
              sequence:
              - target:
                  entity_id: select.prise_seche_serviette_pilot_wire_mode
                data:
                  option: comfort
                action: select.select_option
              - alias: Notification réactivation sèche-serviette
                data:
                  message: Réactivation du sèche-serviette (800W).
                  title: ✅ Appareil réactivé
                action: notify.notify
        - alias: Notification d'impossibilité de charge forcée
          data:
            message: 'Charge forcée impossible : consommation réseau trop élevée

              ({{ consommation_totale }}W).

              '
            title: ⚠️ Charge forcée désactivée
          action: notify.notify
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.charge_vehicule_forcee
          state: 'off'
        - condition: state
          entity_id: input_boolean.charge_vehicule_solaire
          state: 'off'
        alias: Charge véhicule
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''sensor.esphome_web_a92940_marstek_battery_state_of_charge'')
            | float(0) <= states(''input_number.soc_optimisation_hp_hc'') | float(0)
            }}'
          alias: SOC optimisé >= SOC actuel
        - condition: state
          entity_id: input_boolean.optimisation_batterie_hp_hc
          state: 'on'
        - condition: state
          entity_id: select.energie_consommee_j
          state: HC
        then:
        - alias: Charge/Décharge à 0
          target:
            entity_id:
            - number.esphome_web_a92940_marstek_forcible_charge_power
            - number.esphome_web_a92940_marstek_forcible_discharge_power
          data:
            value: '0'
          action: number.set_value
        - target:
            entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
          data:
            option: stop
          action: select.select_option
        - target:
            entity_id: select.esphome_web_a92940_marstek_rs485_control_mode
          data:
            option: disable
          action: select.select_option
        else:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ consigne_batterie >= -zone_morte and consigne_batterie
                <=

                zone_morte }}'
              alias: Zone Morte Dynamique
            sequence:
            - alias: Charge/Décharge à 0 (zone morte)
              target:
                entity_id:
                - number.esphome_web_a92940_marstek_forcible_charge_power
                - number.esphome_web_a92940_marstek_forcible_discharge_power
              data:
                value: '0'
              action: number.set_value
            - target:
                entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
              data:
                option: stop
              action: select.select_option
            - target:
                entity_id: select.esphome_web_a92940_marstek_rs485_control_mode
              data:
                option: disable
              action: select.select_option
          - conditions:
            - condition: template
              value_template: '{{ consigne_batterie > zone_morte }}'
            sequence:
            - alias: Décharge
              choose:
              - conditions:
                - alias: SOC < SOC MIN
                  condition: template
                  value_template: '{{ soc_batterie < soc_min or float(states(''sensor.soc_estime_batterie''),10)==0
                    or float(states(''sensor.esphome_web_a92940_marstek_battery_voltage_average''),0)<48}}

                    '
                sequence:
                - alias: Mode Stop (SOC min ou tension basse)
                  if:
                  - condition: not
                    conditions:
                    - condition: state
                      entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
                      state: stop
                  then:
                  - target:
                      entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
                    data:
                      option: stop
                    action: select.select_option
                - target:
                    entity_id:
                    - number.esphome_web_a92940_marstek_forcible_charge_power
                    - number.esphome_web_a92940_marstek_forcible_discharge_power
                  data:
                    value: '0'
                  action: number.set_value
                - if:
                  - condition: state
                    entity_id: select.esphome_web_a92940_marstek_rs485_control_mode
                    state: enable
                  then:
                  - target:
                      entity_id: select.esphome_web_a92940_marstek_rs485_control_mode
                    data:
                      option: disable
                    action: select.select_option
              - conditions:
                - condition: template
                  value_template: '{{ soc_batterie >= soc_min}}'
                  alias: SOC >= SOC MIN
                sequence:
                - target:
                    entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
                  data:
                    option: discharge
                  action: select.select_option
                - target:
                    entity_id: number.esphome_web_a92940_marstek_forcible_charge_power
                  data:
                    value: '0'
                  action: number.set_value
                - target:
                    entity_id: number.esphome_web_a92940_marstek_forcible_discharge_power
                  data:
                    value: "{% set p_max = puissance_decharge_max_globale | int %}\n{%
                      if voltage <= 48.0 %}\n  {% set p_max = 500 %}\n{% endif %}\n{%
                      set besoin = consigne_batterie + correction_consigne_decharge
                      %}\n{{ p_max if besoin > p_max else [besoin, 0] | max | int
                      }}\n"
                  action: number.set_value
                - target:
                    entity_id: select.esphome_web_a92940_marstek_rs485_control_mode
                  data:
                    option: enable
                  action: select.select_option
            alias: Décharge > Zone Morte
          - conditions:
            - condition: template
              value_template: '{{ consigne_batterie < -zone_morte }}'
            sequence:
            - alias: Charge
              choose:
              - conditions:
                - condition: template
                  value_template: '{{ soc_batterie >= soc_max}}'
                sequence:
                - target:
                    entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
                  data:
                    option: stop
                  action: select.select_option
                - target:
                    entity_id:
                    - number.esphome_web_a92940_marstek_forcible_charge_power
                    - number.esphome_web_a92940_marstek_forcible_discharge_power
                  data:
                    value: '0'
                  action: number.set_value
                - target:
                    entity_id: select.esphome_web_a92940_marstek_rs485_control_mode
                  data:
                    option: disable
                  action: select.select_option
                alias: SOC >= SOC MAX
              - conditions:
                - condition: template
                  value_template: '{{ soc_batterie < soc_max}}'
                sequence:
                - target:
                    entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
                  data:
                    option: charge
                  action: select.select_option
                - target:
                    entity_id: number.esphome_web_a92940_marstek_forcible_discharge_power
                  data:
                    value: '0'
                  action: number.set_value
                - target:
                    entity_id: number.esphome_web_a92940_marstek_forcible_charge_power
                  data:
                    value: "{% set p_max = puissance_charge_max_globale | int %}\n{%
                      if voltage > 55.5 %}\n  {% set p_max = 100 %}\n{% elif voltage
                      >= 55 %}\n  {% set p_max = 500 %}\n{% endif %}\n{% set dispo
                      = (consigne_batterie | abs) + correction_consigne_charge %}\n{{
                      p_max if dispo > p_max else [dispo, 0] | max | int }}\n"
                  action: number.set_value
                - target:
                    entity_id: select.esphome_web_a92940_marstek_rs485_control_mode
                  data:
                    option: enable
                  action: select.select_option
                alias: SOC < SOC MAX
            alias: Charge > Zone Morte
      alias: Gestion Autonome
    default:
    - target:
        entity_id: select.esphome_web_a92940_marstek_forcible_charge_discharge
      data:
        option: stop
      action: select.select_option
    - target:
        entity_id:
        - number.esphome_web_a92940_marstek_forcible_charge_power
        - number.esphome_web_a92940_marstek_forcible_discharge_power
      data:
        value: '0'
      action: number.set_value
    - target:
        entity_id: select.esphome_web_a92940_marstek_rs485_control_mode
      data:
        option: disable
      action: select.select_option
  mode: restart
- id: '1744819508007'
  alias: Batterie pleine/vide
  description: ''
  triggers:
  - value_template: "{{ states('sensor.esphome_web_a92940_marstek_battery_state_of_charge')
      | float(0) >=\n   states('number.esphome_web_a92940_marstek_charging_cutoff_capacity')
      | float(1) and is_state('input_boolean.batterie_notification_envoyee','off')
      and states('sensor.esphome_web_a92940_marstek_battery_state_of_charge') != 'unavailable'
      and states('sensor.esphome_web_a92940_marstek_battery_state_of_charge') != 'unknown'
      and states('number.esphome_web_a92940_marstek_charging_cutoff_capacity') !=
      'unavailable' and states('number.esphome_web_a92940_marstek_charging_cutoff_capacity')
      != 'unknown'}}\n"
    trigger: template
    id: plein
  - value_template: "{{ states('sensor.esphome_web_a92940_marstek_battery_state_of_charge')
      | float(1) <=\n   states('number.esphome_web_a92940_marstek_discharging_cutoff_capacity')
      | float(0) and states('sensor.esphome_web_a92940_marstek_battery_state_of_charge')
      != 'unavailable' and states('sensor.esphome_web_a92940_marstek_battery_state_of_charge')
      != 'unknown' and states('number.esphome_web_a92940_marstek_discharging_cutoff_capacity')
      != 'unavailable' and states('number.esphome_web_a92940_marstek_discharging_cutoff_capacity')
      != 'unknown'}}\n"
    trigger: template
    id: vide
  - trigger: battery.level_crossed_threshold
    target:
      entity_id: sensor.esphome_web_a92940_marstek_battery_state_of_charge
    options:
      behavior: each
      for: 00:00:00
      threshold:
        type: above
        value:
          active_choice: number
          number: 20
    id: Backup
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - plein
      sequence:
      - target:
          entity_id: input_boolean.batterie_notification_envoyee
        action: input_boolean.turn_on
        data: {}
      - data:
          message: "\U0001F50B Batterie pleine ({{ states('sensor.esphome_web_a92940_marstek_battery_state_of_charge')
            }}%)"
        action: notify.notify
      - delay:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
    - conditions:
      - condition: trigger
        id:
        - vide
      sequence:
      - data:
          message: "\U0001FAAB Batterie vide... ({{ states('sensor.soc_estime_batterie')
            }}% / {{ states('sensor.esphome_web_a92940_marstek_battery_state_of_charge')
            }}%)"
        action: notify.notify
    - conditions:
      - condition: trigger
        id:
        - Backup
      sequence:
      - if:
        - condition: switch.is_off
          target:
            entity_id: switch.disjoncteur_zigbee_2
          options:
            behavior: any
            for: 00:00:00
        then:
        - action: switch.turn_on
          metadata: {}
          target:
            entity_id: switch.disjoncteur_zigbee_2
          data: {}
        alias: Réactivation du Backup Batterie
  mode: single
- id: '1744820100625'
  alias: Reset notif batterie pleine
  description: Réinitialise la notification quand la batterie est sous 90% du seuil
    de coupure
  triggers:
