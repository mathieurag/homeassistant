- id: '1763645726678'
  alias: Tirage d'eau
  description: Analyse des données de consommation d'eau
  triggers:
  - trigger: state
    id: tirage
    entity_id:
    - sensor.watermeter_water_usage
  - trigger: state
    id: conso
    entity_id:
    - sensor.watermeter_total_water_usage
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.watermeter_water_usage
          state:
          - unavailable
        - condition: state
          entity_id: sensor.watermeter_water_usage
          state:
          - unknown
      - condition: and
        conditions:
        - condition: trigger
          id:
          - tirage
        - condition: numeric_state
          entity_id: sensor.watermeter_water_usage
          below: 0.01
    - condition: trigger
      id:
      - conso
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - tirage
      sequence:
      - variables:
          heure_debut: '{{ now().timestamp() }}'
          volume_debut: '{{ states(''sensor.watermeter_total_water_usage'') | float
            }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ float(states(''sensor.watermeter_water_usage''),0)==0}}'
      - variables:
          volume_fin: '{{ states(''sensor.watermeter_total_water_usage'') | float
            }}'
          volume: '{{ volume_fin - volume_debut }}'
          duree: '{{ now().timestamp() - heure_debut }}'
          temperature_debut: '{{ states(''sensor.sonde_temperature_owon_temperature'')
            | float }}'
          temperature_fin: '{{ states(''sensor.sonde_temperature_owon_temperature'')
            | float }}'
          delta_temperature: '{{ temperature_fin - temperature_debut }}'
          debit_moyen: '{{ (volume / duree * 60) if duree > 0 else 0 }}'
      - wait_template: "{{ not is_state('input_boolean.lave_linge', 'on') and\n   not
          is_state('input_boolean.lave_vaisselle', 'on') }}"
        timeout:
          hours: 0
          minutes: 0
          seconds: 30
          milliseconds: 0
        continue_on_timeout: true
      - variables:
          type_tirage: "{% if states('input_boolean.lave_vaisselle') == 'on' %}\n
            \ lave_vaisselle\n{% elif states('input_boolean.lave_linge') == 'on' %}\n
            \ lave_linge\n{% elif delta_temperature < seuil_delta_temperature and
            debit_moyen < seuil_debit_douche_enfant_max and volume >= seuil_volume_douche_enfant_min
            %}\n  douche_enfant\n{% elif delta_temperature < seuil_delta_temperature
            and debit_moyen >= seuil_debit_douche_adulte_min and volume >= seuil_volume_douche_adulte_min
            %}\n  douche_adulte\n{% elif delta_temperature < seuil_delta_temperature
            and volume >= seuil_volume_bain_min %}\n  bain\n{% elif volume <= seuil_volume_toilettes_max
            and duree <= seuil_duree_toilettes_max %}\n  toilettes\n{% else %}\n  inconnu\n{%
            endif %}"
      - data:
          title: 'Nouveau tirage d''eau détecté : {{ type_tirage }}'
          message: 'Type : {{ type_tirage }} Volume : {{ volume | round(1) }} L Durée
            : {{ (duree / 60) | round(1) }} min Débit moyen : {{ debit_moyen | round(1)
            }} L/min ΔT ECS : {{ delta_temperature | round(1) }} °C'
        action: notify.notify
    - conditions:
      - condition: trigger
        id:
        - conso
      sequence:
      - condition: and
        conditions:
        - condition: numeric_state
          entity_id: sensor.watermeter_water_usage
          below: 0.1
        - condition: template
          value_template: '{{ (states(''sensor.watermeter_total_water_usage'') | float)
            - (trigger.from_state.state | float) >= seuil_fuite_lente_volume }}'
        - condition: template
          value_template: '{{ (now().timestamp() - trigger.from_state.last_changed.timestamp())
            | int >= seuil_fuite_lente_duree }}'
      - data:
          title: '⚠️ Alerte : Fuite lente détectée !'
          message: "Volume perdu : {{ (states('sensor.watermeter_total_water_usage')
            | float) - (trigger.from_state.state | float) | round(1) }} L Durée :
            {{ (now().timestamp() - trigger.from_state.last_changed.timestamp()) |
            int / 60 | round(1) }} min Débit moyen : {{\n  ((states('sensor.watermeter_total_water_usage')
            | float) - (trigger.from_state.state | float)) /\n  ((now().timestamp()
            - trigger.from_state.last_changed.timestamp()) | int) * 60 | round(2)\n}}
            L/min"
        action: notify.notify
  mode: restart
  variables:
    seuil_debit_min: 0.5
    seuil_debit_douche_enfant_max: 8
    seuil_debit_douche_adulte_min: 8
    seuil_volume_toilettes_max: 10
    seuil_volume_douche_enfant_min: 20
    seuil_volume_douche_adulte_min: 40
    seuil_volume_bain_min: 80
    seuil_duree_toilettes_max: 60
    seuil_delta_temperature: -2
    temps_attente_fin_tirage: 30
    seuil_fuite_lente_volume: 10
    seuil_fuite_lente_duree: 3600
