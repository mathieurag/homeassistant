- id: '1776980057000'
  alias: Recharge véhicule
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.vr7kczkz9tl032137_batterie_en_charge
    from:
    - 'on'
    trigger: state
    to:
    - 'off'
    id: 'off'
    for:
      hours: 0
      minutes: 2
      seconds: 0
  - entity_id:
    - binary_sensor.vr7kczkz9tl032137_batterie_en_charge
    trigger: state
    id: 'on'
    from:
    - 'off'
    to:
    - 'on'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: state
    entity_id:
    - sensor.vr7kczkz9tl032137_last_charge
    id: last_charge
    for:
      hours: 0
      minutes: 2
      seconds: 0
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'on'
        - last_charge
      - condition: switch.is_off
        target:
          entity_id: input_boolean.recharge_vehicule
        options:
          behavior: any
          for: 00:00:00
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.vr7kczkz9tl032137_last_charge
          state:
          - unknown
          - unavailable
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'off'
      - condition: switch.is_on
        target:
          entity_id: input_boolean.recharge_vehicule
        options:
          behavior: any
          for: 00:00:00
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.vr7kczkz9tl032137_last_charge
          state:
          - unknown
          - unavailable
        enabled: false
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'on'
        - last_charge
      sequence:
      - variables:
          index_actuel: '{{ states(''sensor.vr7kczkz9tl032137_batterie_restante'')
            | float(0) }}'
      - target:
          entity_id: input_number.energie_recharge_derniere
        data:
          value: '{{ index_actuel }}'
        action: input_number.set_value
      - action: notify.mobile_app_iphone_de_mat_13
        metadata: {}
        data:
          title: '{% set types = { ''slow'': ''lente'', ''normal'': ''normale'', ''quick'':
            ''rapide'' } %}

            {% set charge = states(''sensor.vr7kczkz9tl032137_type_de_charge_batterie'')
            %}

            Charge {{ types.get(charge, charge) }} en cours '
          message: '{{states(''sensor.puissance_recharge_vehicule'')}} kW : {{states(''sensor.vr7kczkz9tl032137_niveau_batterie'')}}
            % / {{states(''sensor.vr7kczkz9tl032137_autonomie_batterie'')}} km. Fin
            de charge prévue : {{as_timestamp(states(''sensor.vr7kczkz9tl032137_fin_de_charge_batterie_estimee''))
            | timestamp_custom(''%H:%M'') }}'
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id: input_boolean.recharge_vehicule
        data: {}
    - conditions:
      - condition: trigger
        id:
        - 'off'
        - last_charge
      sequence:
      - variables:
          index_actuel: '{{ states(''sensor.vr7kczkz9tl032137_batterie_restante'')
            | float(0) }}'
          index_ref: '{{ states(''input_number.energie_recharge_derniere'') | float(0)
            }}'
          delta_kwh: '{{ (index_actuel - index_ref) | float(0) | round(2) }}'
      - choose:
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: person.matrag
              state:
              - Travail
            - condition: state
              entity_id: device_tracker.vr7kczkz9tl032137_vehicule
              state:
              - not_home
              - Travail
          sequence:
          - target:
              entity_id: input_number.energie_recharge_pro
            data:
              value: '{{ (states(''input_number.energie_recharge_pro'') | float(0)
                + delta_kwh) | round(2) }}'
            action: input_number.set_value
          - target:
              entity_id: input_number.cout_recharge_pro
            data:
              value: '{{ (states(''input_number.cout_recharge_pro'') | float(0) +
                0) | round(2) }}'
            action: input_number.set_value
          - action: notify.mobile_app_iphone_de_mat_13
            metadata: {}
            data:
              title: Charge Pro terminée - {{states('sensor.vr7kczkz9tl032137_niveau_batterie')|
                float(0)}} %
              message: "+{{delta_kwh | float(0)}} kWh - {{states('sensor.vr7kczkz9tl032137_autonomie_batterie')|
                float(0)}} km d'autonomie\n                                                         "
          alias: Pro
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: sensor.nrg_kick_status
              state:
              - charging
              - wakeup
              - connected
            - condition: and
              conditions:
              - condition: state
                entity_id: device_tracker.vr7kczkz9tl032137_vehicule
                state:
                - Nougein
                - home
              - condition: time
                weekday:
                - sat
                - sun
              - condition: state
                entity_id: device_tracker.iphone_de_mat
                state:
                - Nougein
                - home
          sequence:
          - target:
              entity_id: input_number.energie_recharge_perso
            data:
              value: '{{ (states(''input_number.energie_recharge_perso'') | float(0)
                + delta_kwh) | round(2) }}'
            action: input_number.set_value
          - target:
              entity_id: input_number.cout_recharge_perso
            data:
              value: '{{ (states(''input_number.cout_recharge_perso'') | float(0)
                + (delta_kwh * 0.15)) | round(2) }}'
            action: input_number.set_value
          - action: notify.mobile_app_iphone_de_mat_13
            metadata: {}
            data:
              title: Charge Perso terminée - {{states('sensor.vr7kczkz9tl032137_niveau_batterie')|
                float(0)}} %
              message: "+{{delta_kwh | float(0)}} kWh - {{states('sensor.vr7kczkz9tl032137_autonomie_batterie')|
                float(0)}} km d'autonomie\n                                                         "
          alias: Perso
        default:
        - target:
            entity_id: input_number.energie_recharge_pro
          data:
            value: '{{ (states(''input_number.energie_recharge_pro'') | float(0) +
              delta_kwh) | round(2) }}'
          action: input_number.set_value
        - target:
            entity_id: input_number.cout_recharge_pro
          data:
            value: '{{ (states(''input_number.cout_recharge_pro'') | float(0) + 0)
              | round(2) }}'
          action: input_number.set_value
      - target:
          entity_id: input_number.energie_recharge_derniere
        data:
          value: '{{ index_actuel }}'
        action: input_number.set_value
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.recharge_vehicule
        data: {}
