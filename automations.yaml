- id: '1780600867247'
  alias: Consommation véhicule
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.vr7kczkz9tl032137_deplacement
    to:
    - 'on'
    from:
    - 'off'
    id: 'on'
  - trigger: state
    entity_id: sensor.vr7kczkz9tl032137_dernier_trajet
    id: 'off'
  - trigger: state
    entity_id:
    - sensor.vr7kczkz9tl032137_kilometrage
    id: km
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: switch.is_off
        target:
          entity_id: input_boolean.trajet_vehicule_en_cours
        options:
          behavior: any
          for: 00:00:00
      - condition: trigger
        id:
        - 'on'
      - alias: Kilométrage référence = Kilométrage actuel
        condition: template
        value_template: '{{float(states(''input_number.kilometrage_vehicule_reference''),0)<=

          float(states(''sensor.vr7kczkz9tl032137_kilometrage''),0)}}'
    - condition: and
      conditions:
      - condition: switch.is_on
        target:
          entity_id: input_boolean.trajet_vehicule_en_cours
        options:
          behavior: any
          for: 00:00:00
      - condition: trigger
        id:
        - 'off'
      - condition: numeric_state
        entity_id: input_number.kilometrage_vehicule_reference
        below: sensor.vr7kczkz9tl032137_kilometrage
    - condition: and
      conditions:
      - condition: trigger
        id:
        - km
      - condition: numeric_state
        entity_id: input_number.kilometrage_vehicule_reference
        below: sensor.vr7kczkz9tl032137_kilometrage
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'on'
      sequence:
      - if: []
        then:
        - action: input_number.set_value
          data:
            value: '{{ states(''sensor.vr7kczkz9tl032137_batterie_restante'') }}'
          target:
            entity_id: input_number.energie_vehicule_reference
        - action: input_number.set_value
          data:
            value: '{{ states(''sensor.vr7kczkz9tl032137_kilometrage'') }}'
          target:
            entity_id: input_number.kilometrage_vehicule_reference
        - action: input_boolean.turn_on
          metadata: {}
          target:
            entity_id: input_boolean.trajet_vehicule_en_cours
          data: {}
    - conditions:
      - condition: trigger
        id:
        - 'off'
      sequence:
      - variables:
          km: '{{ states(''sensor.vr7kczkz9tl032137_kilometrage'') | float(0) }}'
          delta_km: '{{ (km - states(''input_number.kilometrage_vehicule_reference'')
            | float(0))|  float(0)}}'
          energie: '{{ states(''sensor.vr7kczkz9tl032137_batterie_restante'') | float(0)
            }}'
          delta_energie: '{{ (states(''input_number.energie_vehicule_reference'')  |
            float(0) - energie) | float(0)}}'
      - action: input_number.set_value
        data:
          value: '{{ (delta_energie/delta_km*100) | float(0) | round(1)}}'
        target:
          entity_id: input_number.consommation_vehicule
      - action: notify.notify
        metadata: {}
        data:
          title: Dernier trajet
          message: 'Distance : {{ delta_km | float(0) | round(1)}} / {{ states(''sensor.vr7kczkz9tl032137_dernier_trajet'')}}
            km

            Consommation : {{ (delta_energie/delta_km*100) | float(0) | round(1)}}
            kWh/100km'
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.trajet_vehicule_en_cours
        data: {}
    - conditions:
      - condition: trigger
        id:
        - km
      sequence:
      - if:
        - condition: numeric_state
          entity_id: sensor.vr7kczkz9tl032137_kilometrage
          above: input_number.kilometrage_vehicule
        then:
        - action: input_number.set_value
          metadata: {}
          data:
            value: '{{states(''sensor.vr7kczkz9tl032137_kilometrage'',1) | float(0)
              }}'
          target:
            entity_id: input_number.kilometrage_vehicule
  mode: single
