      hours: 0
      minutes: 0
      seconds: 0
    from:
    - Online
    to:
    - On Battery
    - On Battery, Battery Discharging
  - trigger: state
    entity_id:
    - sensor.ups_status
    from:
    - OL
    id: Coupure
    to:
    - OB
    - OB DISCHRG
  - trigger: numeric_state
