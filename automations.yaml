- id: '1769014745976'
  alias: Alerte Flux bloqué
  description: Notification détaillée lors d'un rejet firewall avec protection contre
    les erreurs d'index
  triggers:
  - entity_id:
    - sensor.loki_pve_liste
    - sensor.loki_pve_liste_n97
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state.state not in [''unknown'', ''unavailable'']
      }}'
  - condition: template
    value_template: "{% set entries_to = trigger.to_state.attributes.entries %} {%
      set entries_from = trigger.from_state.attributes.entries %} {{ entries_to is
      defined and entries_to | length > 0 and \n   (entries_from is not defined or
      entries_to[0][1] != entries_from[0][1]) }}\n"
  - condition: template
    value_template: '{% set pattern = ''SRC=([0-9.]+) DST=([0-9.]+) .* DPT=([0-9]+)''
      %} {% set new_log = trigger.to_state.attributes.entries[0][1] %} {% set old_log
      = trigger.from_state.attributes.entries[0][1] if trigger.from_state.attributes.entries
      is defined else '''' %}

      {% set new_sig = new_log | regex_findall(pattern) %} {% set old_sig = old_log
      | regex_findall(pattern) %}

      {# On ne continue que si le nouveau log match le pattern et est différent du
      précédent #} {{ new_sig | count > 0 and new_sig != old_sig }}

      '
  actions:
  - variables:
      last_log: '{{ trigger.to_state.attributes.entries[0][1] }}'
      src_ip: '{{ last_log | regex_findall_index(''SRC=([0-9.]+)'', default=''0.0.0.0'')
        }}'
      dst_ip: '{{ last_log | regex_findall_index(''DST=([0-9.]+)'', default=''0.0.0.0'')
        }}'
      port: '{{ last_log | regex_findall_index(''DPT=([0-9]+)'', default=''N/A'')
        }}'
      proto: '{{ last_log | regex_findall_index(''PROTO=([A-Z]+)'', default=''TCP/UDP'')
        }}'
      server_name: '{{ ''N97 (Host-001)'' if ''n97'' in trigger.entity_id else ''Serveur
        Principal'' }}'
      device_name_src: "{% set dev = states.device_tracker \n   | selectattr('attributes.ip',
        'defined') \n   | selectattr('attributes.ip', 'eq', src_ip) \n   | map(attribute='attributes.friendly_name')
        | first | default(none) %}\n{{ dev if dev is not none else src_ip }}"
      device_name_dst: "{% set dev = states.device_tracker \n   | selectattr('attributes.ip',
        'defined') \n   | selectattr('attributes.ip', 'eq', dst_ip) \n   | map(attribute='attributes.friendly_name')
        | first | default(none) %}\n{{ dev if dev is not none else dst_ip }}"
  - action: notify.notify
    data:
      title: "\U0001F6E1️ Firewall {{ server_name }}"
      message: 'Nouveau rejet : {{ device_name_src }} vers {{ device_name_dst }} via
        {{ proto }}/{{ port }}.

        '
      data:
        notification_icon: mdi:shield-remove
        clickAction: /tableau-de-bord/{{ 'server' if 'n97' in trigger.entity_id else
          'server2' }}
  - delay: 00:01:00
  mode: parallel
  max: 2
