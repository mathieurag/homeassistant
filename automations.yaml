        - calcul
        - calcul2
      sequence:
      - if:
        - condition: trigger
          id:
          - calcul2
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.energie_maison_minuit
          data:
            value: '{{ float(states(''sensor.energie_maison''),0) }}

              '
        alias: Energie Maison
      - variables:
          capacite_totale: 5.12
          soc_min_technique: 12
          talon_hp: "{% set index_actuel = states('sensor.energie_maison') | float(0)
            %} {% set index_minuit = states('input_number.energie_maison_minuit')
            | float(index_actuel) %} {% set delta_h = now().hour + (now().minute /
            60) %}\n{% if delta_h > 0.5 %} \n  {# Moyenne réelle kWh/h depuis minuit
            #}\n  {% if states('input_boolean.mode_chauffage')==\"on\" %}\n    {%
            if states('climate.clim_leo')==\"heat\" or states('climate.clim_lisa')==\"heat\"
            or states('climate.clim_parents')==\"heat\"  %}\n      {{ ((index_actuel
            - index_minuit) / delta_h) | round(3) + 0.1}}\n    {% else %}\n      {{
            ((index_actuel - index_minuit) / delta_h) | round(3) + 0.1}}\n    {% endif
            %}\n  {% endif %}\n{% else %}\n  {# Valeur de secours si trop proche de
            minuit ou reset #}\n  0.3\n{% endif %}\n"
          marge_securite: 0.2
          soc_final: "{% set forecast = state_attr('sensor.solcast_pv_forecast_previsions_pour_aujourd_hui',
            'detailedForecast') %} {% set ns = namespace(besoin_kwh=0, fini=false)
            %}\n{% if forecast is not none %}\n  {% for slot in forecast %}\n    {%
            set start = as_datetime(slot.period_start).astimezone() %}\n    {% if
            start.hour >= 6 and start.hour < 11 and not ns.fini %}\n      {% set pv
            = slot.pv_estimate | float(0) %}\n      {% if pv < talon_hp %}\n        {%
            set ns.besoin_kwh = ns.besoin_kwh + (talon_hp - pv) * 0.5 %}\n      {%
            else %}\n        {% set ns.fini = true %}\n      {% endif %}\n    {% endif
            %}\n  {% endfor %}\n{% endif %}\n{% set besoin_total = ns.besoin_kwh +
            marge_securite %} {% set soc_reserve_hp = (besoin_total / capacite_totale)
            * 100 %} {% set resultat = soc_reserve_hp + soc_min_technique %}\n{{ [resultat,
            100] | min | round(1) }}\n"
      - action: input_number.set_value
        target:
          entity_id: input_number.soc_optimisation_hp_hc
        data:
          value: '{{ soc_final }}

            '
    - conditions:
      - condition: trigger
        id: reset
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.soc_optimisation_hp_hc
        data:
          value: 0
  mode: single
