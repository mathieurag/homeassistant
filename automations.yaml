- id: '1776698355716'
  alias: Gestion Recharge Véhicule
  description: Pilote la charge avec régulation dynamique pour maintenir -10W sur
    le réseau.
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.charge_vehicule_forcee
    - input_boolean.charge_vehicule_solaire
    id: modes_change
  - trigger: state
    entity_id:
    - sensor.em06_02_b1_power
    id: sensors_update
    enabled: false
  - trigger: state
    entity_id:
    - sensor.nrg_kick_total_active_power
    id: sensors_update
  actions:
  - variables:
      mode_force: '{{ is_state(''input_boolean.charge_vehicule_forcee'', ''on'') }}'
      grid: '{{ states(''sensor.em06_02_b1_power'') | float(0) }}'
      ve_power: '{{ states(''sensor.nrg_kick_total_active_power'') | float(0) }}'
      ve_power2: '{{ states(''sensor.consommation_borne'') | float(0) }}'
      voltage: '{{ states(''sensor.nrg_kick_charging_voltage'') | float(250) }}'
      voltage2: '{{ states(''sensor.em06_02_b1_voltage'') | float(250) }}'
      courant_max: '{{ states(''sensor.nrg_kick_max_current_of_the_attachment_in_ampere'')
        | float(6) | int }}'
      target_ve_power: '{{ (9000  + ve_power - grid ) | float(0) | int if mode_force
        else [0, (ve_power - grid)] | max | float(0) | int  }}'
      courant: '{{ (target_ve_power / voltage) | round(1, ''floor'') | float(0) }}'
      courant_final: '{{[courant,courant_max] | min | float(0) | round(1, ''floor'')  }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ courant_final < 6 }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.nrg_kick_charging_enabled
        enabled: false
      - action: number.set_value
        target:
          entity_id: number.nrg_kick_user_set_charging_current
        data:
          value: '{{ courant_final }}'
      alias: Désactivation Charge (<6A)
    - conditions:
      - condition: template
        value_template: '{{ courant_final >= 6 }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.nrg_kick_charging_enabled
      - action: number.set_value
        target:
          entity_id: number.nrg_kick_user_set_charging_current
        data:
          value: '{{ courant_final }}'
      alias: Activation Charge (>6A)
  mode: restart
