- id: '1783092283573'
  alias: Alerte batterie
  description: ''
  triggers:
  - trigger: state
    entity_id: sensor.esphome_web_a92940_marstek_inverter_state
    id: change
  - trigger: time_pattern
    minutes: '*'
    id: reset
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - change
      sequence:
      - action: counter.increment
        metadata: {}
        target:
          entity_id: counter.changement_etat_batterie
        data: {}
      - if:
        - condition: and
          conditions:
          - condition: counter.is_value
            target:
              entity_id: counter.changement_etat_batterie
            options:
              for: 00:00:00
              threshold:
                type: above
                value:
                  active_choice: number
                  number: 6
          - condition: switch.is_on
            target:
              entity_id: input_boolean.gestion_batterie_autonome
            options:
              behavior: any
              for: 00:00:00
          - condition: numeric_state
            entity_id: sensor.esphome_web_a92940_marstek_battery_state_of_charge
            below: 100
        then:
        - action: input_boolean.turn_off
          metadata: {}
          target:
            entity_id: input_boolean.gestion_batterie_autonome
          data: {}
        - action: notify.notify
          metadata: {}
          data:
            title: Alerte Batterie
            message: 'Bagots constatés : désactivation gestion autonome'
    - conditions:
      - condition: trigger
        id:
        - reset
      sequence:
      - action: counter.reset
        metadata: {}
        target:
          entity_id: counter.changement_etat_batterie
        data: {}
  mode: single
